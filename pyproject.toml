[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "afpool"
version = "1.0.0"
description = "Open-set radio-frequency identification of individual drones by acquisition-factor pooling: RECR and RGD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "joblib>=1.3", "torch>=2.1", "hdbscan==0.8.44"]

[tool.setuptools]
packages = ["afpool"]
